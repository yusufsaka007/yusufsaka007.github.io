{{- define "main" -}}

<div class="list-header">
  <h1>{{ .Section | default .Title | replace "-" " " }}</h1>
  {{- with .Content }}
  <p>{{ . | plainify }}</p>
  {{- end }}
</div>

{{- if .Pages }}
<ul class="post-list">
  {{- range .Pages }}
  <li class="post-item">
    <a href="{{ .RelPermalink }}">
      <span class="date">{{ .Date.Format "2006-01-02" }}</span>
      <span class="title">{{ .Title }}</span>
    </a>
  </li>
  {{- end }}
</ul>
{{- else }}
<p class="empty-notice">nothing here yet.</p>
{{- end }}

{{- end }}
